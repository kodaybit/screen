<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diabrowser.com</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #00ff88;
    }
    p {
      font-size: 1.2rem;
      margin: 0 1rem 2rem;
      max-width: 600px;
      line-height: 1.5;
    }
    a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 12px 24px;
      border: 2px solid #00ff88;
      border-radius: 12px;
      transition: all 0.3s;
      cursor: pointer;
      user-select: none;
    }
    a:hover {
      background: #00ff88;
      color: #000;
      transform: scale(1.05);
    }
    #imgContainer {
      margin-top: 2rem;
      width: 90%;
      max-width: 600px;
      border: 3px dashed #00ff88;
      border-radius: 12px;
      padding: 1rem;
      background: rgba(0,255,136,0.05);
    }
    #img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      display: none;
    }
    #fileSelect {
      display: none;
    }
    .hint {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: #aaa;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Dia Browser Fast Upload</h1>
  
  <p>
    Long press (or right-click) the button below and choose <strong>"Open in new tab"</strong> or <strong>"Open link"</strong>.<br>
    This will trigger fast file upload without split view.
  </p>

  <a id="link" href="https://www.diabrowser.com/">Long Press / Right Click Here</a>

  <div id="imgContainer">
    <img id="img" alt="Uploaded preview">
  </div>

  <p class="hint">
    After opening the link, your uploaded image will appear here instantly.
  </p>

  <input id="fileSelect" type="file" accept="image/*">

  <script>
    const link = document.getElementById('link');
    const fileSelect = document.getElementById('fileSelect');
    const img = document.getElementById('img');

    // Deteksi long press / contextmenu (right-click)
    link.addEventListener('contextmenu', function(e) {
      e.preventDefault(); // cegah context menu default

      // Delay 4 detik seperti kode asli
      setTimeout(() => {
        // Trigger file picker
        fileSelect.click();
      }, 4000);
    });

    // Saat file dipilih, tampilkan preview
    fileSelect.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(this.files[0]);
      }
    });

    // Optional: klik biasa juga bisa trigger (untuk mobile long press)
    link.addEventListener('click', function(e) {
      // Hanya jika long press tidak terdeteksi (fallback)
      if (!e.defaultPrevented) {
        setTimeout(() => {
          fileSelect.click();
        }, 4000);
      }
    });
  </script>
</body>
</html>
